[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-helper"
version = "0.1.0"
description = "LLM assistant for Ableton Live: creates sounds on request and helps navigate Live"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
abhelper = "abhelper.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
abhelper = ["sound/recipes/*.json", "sound/data/*.json", "knowledge/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "remote_script/tests"]
