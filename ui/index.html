<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Ableton Helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <h1 class="title">Ableton Helper</h1>
    <div class="status" id="status" role="group" aria-label="Состояние подключений">
      <span class="dot-wrap" id="st-live" title="Live: проверяю…"><span class="dot" data-state="unknown"></span><span class="dot-label">Live</span></span>
      <span class="dot-wrap" id="st-ai" title="AI: проверяю…"><span class="dot" data-state="unknown"></span><span class="dot-label">AI</span></span>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="btn-new" title="Новый чат" aria-label="Новый чат">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM19.4 13.5l1.6 1.2-1.8 3.1-1.9-.6a7.4 7.4 0 0 1-1.7 1l-.4 2h-3.6l-.4-2a7.4 7.4 0 0 1-1.7-1l-1.9.6-1.8-3.1 1.6-1.2a7.6 7.6 0 0 1 0-2l-1.6-1.2 1.8-3.1 1.9.6a7.4 7.4 0 0 1 1.7-1l.4-2h3.6l.4 2a7.4 7.4 0 0 1 1.7 1l1.9-.6 1.8 3.1-1.6 1.2c.1.7.1 1.3 0 2z"/></svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="40" height="40"><g fill="currentColor"><rect x="6" y="14" width="4" height="20" rx="1"/><rect x="14" y="8" width="4" height="32" rx="1"/><rect x="22" y="18" width="4" height="12" rx="1"/><rect x="30" y="10" width="4" height="28" rx="1"/><rect x="38" y="16" width="4" height="16" rx="1"/></g></svg>
      </div>
      <h2>Привет! Что будем делать?</h2>
      <p>Опишите звук словами, и я соберу дорожку в вашем сете. Или спросите, как что-то сделать в Ableton.</p>
      <div class="chips" id="suggestions" aria-label="Примеры запросов"></div>
    </div>
    <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Диалог"></div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <label class="sr-only" for="input">Сообщение</label>
    <textarea id="input" rows="1" placeholder="Напишите, что нужно… (Enter — отправить, Shift+Enter — новая строка)" maxlength="8000"></textarea>
    <button type="submit" class="send-btn" id="btn-send" title="Отправить" aria-label="Отправить">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></svg>
    </button>
    <button type="button" class="stop-btn" id="btn-stop" aria-label="Стоп" title="Остановить" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
      <span>Стоп</span>
    </button>
  </form>

  <div class="overlay" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2 id="settings-title">Настройки</h2>
        <button type="button" class="icon-btn" id="settings-close" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="settings-form" class="panel-body" autocomplete="off">
        <div class="field">
          <label for="cfg-key">API-ключ Anthropic</label>
          <input type="password" id="cfg-key" autocomplete="new-password" spellcheck="false" placeholder="sk-ant-…">
          <div class="hint" id="cfg-key-state"></div>
          <div class="hint">Ключ можно получить на console.anthropic.com (раздел API Keys). Он сохраняется только на вашем компьютере.</div>
        </div>
        <div class="field">
          <label for="cfg-model">Модель</label>
          <select id="cfg-model">
            <option value="claude-opus-5-5">claude-opus-5-5 (по умолчанию)</option>
            <option value="claude-sonnet-5-5">claude-sonnet-5-5</option>
            <option value="claude-haiku-5-5">claude-haiku-5-5</option>
            <option value="__custom__">Другая…</option>
          </select>
          <input type="text" id="cfg-model-custom" placeholder="Идентификатор модели" spellcheck="false" hidden>
        </div>
        <div class="field">
          <label for="cfg-effort">Усилие рассуждения (effort)</label>
          <select id="cfg-effort">
            <option value="low">low — быстрее и дешевле</option>
            <option value="medium">medium</option>
            <option value="high">high — тщательнее</option>
          </select>
        </div>
        <div class="hint" id="cfg-bridge"></div>
        <div class="panel-actions">
          <span class="save-state" id="cfg-saved" role="status"></span>
          <button type="submit" class="btn primary" id="cfg-save">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
